[build]
  command = "node build.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/n/*"
  function = "og"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_blob/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
